name: CreatineTracker

options:
  bundleIdPrefix: com.atalay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:

  CreatineTracker:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
    dependencies:
      - target: CreatineWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Creatine Tracker
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CreatineWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Widget
    settings:
      base:
        PRODUCT_NAME: CreatineWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker.CreatineWidget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  CreatineTracker:
    build:
      targets:
        CreatineTracker: all
    run:
      config: Debug
    archive:
      config: Release
