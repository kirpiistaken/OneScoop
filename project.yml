name: CreatineTracker

options:
  bundleIdPrefix: com.atalay
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:

  CreatineTracker:
    type: application
    platform: iOS
    sources:
      # Ortak dosyalar
      - path: AppGroup.swift
      - path: DayKey.swift
      - path: Intents.swift
      - path: L10n.swift
      - path: Localizable.xcstrings
      - path: Models.swift
      - path: NotificationManager.swift
      - path: Persistence.swift
      - path: Stats.swift
      - path: Theme.swift
      # Sadece uygulama
      - path: CreatineStore.swift
      - path: CreatineTrackerApp.swift
      - path: HistoryView.swift
      - path: OnboardingView.swift
      - path: SettingsView.swift
      - path: Shortcuts.swift
      - path: SupplyView.swift
      - path: TodayView.swift
      - path: CloudSync.swift
      - path: PhoneWatchBridge.swift
      - path: WatchPayload.swift
      - path: Assets.xcassets
    dependencies:
      - target: CreatineWidgetExtension
        embed: true
        codeSign: true
      - target: OneScoopWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_NAME: OneScoop
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker
        INFOPLIST_FILE: App-Info.plist
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CreatineWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AppGroup.swift
      - path: DayKey.swift
      - path: Intents.swift
      - path: L10n.swift
      - path: Localizable.xcstrings
      - path: Models.swift
      - path: NotificationManager.swift
      - path: Persistence.swift
      - path: Stats.swift
      - path: Theme.swift
      - path: CreatineWidget.swift
      - path: LogControl.swift
    settings:
      base:
        PRODUCT_NAME: CreatineWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker.CreatineWidget
        INFOPLIST_FILE: Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  OneScoopWatch:
    type: application
    platform: watchOS
    sources:
      - path: AppGroup.swift
      - path: DayKey.swift
      - path: L10n.swift
      - path: Localizable.xcstrings
      - path: WatchPayload.swift
      - path: Watch
        excludes:
          - "Watch-Info.plist"
          - "Watch.entitlements"
    dependencies:
      - target: OneScoopComplication
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: OneScoopWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker.watchkitapp
        INFOPLIST_FILE: Watch/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/Watch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  OneScoopComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: AppGroup.swift
      - path: DayKey.swift
      - path: L10n.swift
      - path: Localizable.xcstrings
      - path: WatchPayload.swift
      - path: WatchComplication/OneScoopComplication.swift
    settings:
      base:
        PRODUCT_NAME: OneScoopComplication
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker.watchkitapp.complication
        INFOPLIST_FILE: WatchComplication/Complication-Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchComplication/Complication.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  CreatineTracker:
    build:
      targets:
        CreatineTracker: all
    run:
      config: Debug
    archive:
      config: Release
