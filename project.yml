name: CreatineTracker

options:
  bundleIdPrefix: com.atalay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  CreatineTracker:
    type: application
    platform: iOS
    sources:
      # Ortak dosyalar
      - path: AppGroup.swift
      - path: DayKey.swift
      - path: Intents.swift
      - path: Models.swift
      - path: NotificationManager.swift
      - path: Persistence.swift
      - path: Stats.swift
      - path: Theme.swift
      # Sadece uygulama
      - path: CreatineStore.swift
      - path: CreatineTrackerApp.swift
      - path: HistoryView.swift
      - path: OnboardingView.swift
      - path: SettingsView.swift
      - path: TodayView.swift
    dependencies:
      - target: CreatineWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Creatine Daily
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker
        INFOPLIST_FILE: App-Info.plist
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CreatineWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      # Ortak dosyalar — widget target'ına da eklenmek zorunda
      - path: AppGroup.swift
      - path: DayKey.swift
      - path: Intents.swift
      - path: Models.swift
      - path: NotificationManager.swift
      - path: Persistence.swift
      - path: Stats.swift
      - path: Theme.swift
      - path: Assets.xcassets
      # Sadece widget
      - path: CreatineWidget.swift
    settings:
      base:
        PRODUCT_NAME: CreatineWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.atalay.creatinetracker.CreatineWidget
        INFOPLIST_FILE: Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  CreatineTracker:
    build:
      targets:
        CreatineTracker: all
    run:
      config: Debug
    archive:
      config: Release
