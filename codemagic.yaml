workflows:

  ios-testflight:
    name: OneScoop – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: CreatineTrackerKey

    environment:
      xcode: latest
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.atalay.creatinetracker"
        WIDGET_BUNDLE_ID: "com.atalay.creatinetracker.CreatineWidget"
        XCODE_SCHEME: "CreatineTracker"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: XcodeGen kur
        script: brew install xcodegen

      - name: Xcode projesini üret
        script: xcodegen generate --spec project.yml

      - name: Keychain hazırla
        script: keychain initialize

      - name: İmzalama dosyalarını oluştur / indir
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Sertifikayı keychain'e ekle
        script: keychain add-certificates

      - name: Profilleri projeye uygula
        script: xcode-project use-profiles

      - name: Build numarasını artır
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST + 1))

      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --project "CreatineTracker.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - aybatalay@gmail.com
        notify:
          success: true
          failure: true
