workflows:

  ios-testflight:
    name: Creatine Tracker – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      # Codemagic > Teams > Integrations > Developer Portal içinde
      # oluşturduğun App Store Connect API anahtarının adı.
      app_store_connect: CreatineTrackerKey

    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.atalay.creatinetracker"
        XCODE_SCHEME: "CreatineTracker"
      ios_signing:
        distribution_type: app_store
        # Ana bundle ID'yi yazmak yeterli: Codemagic com.atalay.creatinetracker.*
        # ile eşleşen widget profilini de otomatik çeker.
        bundle_identifier: com.atalay.creatinetracker

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: XcodeGen kur
        script: brew install xcodegen

      - name: Xcode projesini üret
        script: xcodegen generate --spec project.yml

      - name: İmzalama profillerini projeye uygula
        script: xcode-project use-profiles

      - name: Build numarasını artır
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST + 1))

      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --project "CreatineTracker.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # App Store incelemesine otomatik göndermek istersen true yap.
        submit_to_app_store: false
      email:
        recipients:
          - seninmailin@example.com
        notify:
          success: true
          failure: true
