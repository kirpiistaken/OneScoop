<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Rozetler ekranı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E15}
a{color:#6E93FF}a:hover{color:#9DB5FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 24px; background: #16181D; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #E9ECF2; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<h1 style="margin: 0; font-size: 34px; font-weight: 900">Rozetler</h1>
<div style="background: #1F2229; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 15px; font-weight: 800">Sıradaki: Alışkanlık</div>
<div style="font-size: 13px; color: #8A92A3">12 gün kaldı</div>
</div>
<div style="height: 8px; border-radius: 4px; background: #2C313C; overflow: hidden">
<div style="width: 60%; height: 8px; border-radius: 4px; background: #5C86FF"></div>
</div>
<div style="font-size: 13px; color: #8A92A3">6 / 12 rozet kazanıldı</div>
</div>
<div style="display: flex; background: #1F2229; border-radius: 12px; padding: 3px; gap: 3px">
<button type="button" style="flex-grow: 1; border: 0; border-radius: 10px; padding: 8px 0; background: #3A3F4B; color: #F4F6FA; font: 800 14px Nunito, sans-serif">Tümü</button>
<button type="button" style="flex-grow: 1; border: 0; border-radius: 10px; padding: 8px 0; background: transparent; color: #A9B1C2; font: 700 14px Nunito, sans-serif">Kreatin</button>
<button type="button" style="flex-grow: 1; border: 0; border-radius: 10px; padding: 8px 0; background: transparent; color: #A9B1C2; font: 700 14px Nunito, sans-serif">Su</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: {{it.opacity}}">
<div style="position: relative; width: 100px; height: 110px">
<svg width="100" height="110" viewBox="0 0 200 220" role="img" aria-label="{{it.name}}" style="overflow: visible">
<defs>
<linearGradient id="m{{it.id}}" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="{{it.c1}}"></stop>
<stop offset="1" stop-color="{{it.c2}}"></stop>
</linearGradient>
<linearGradient id="i{{it.id}}" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="{{it.i1}}"></stop>
<stop offset="1" stop-color="{{it.i2}}"></stop>
</linearGradient>
</defs>
<polygon points="64,128 46,214 66,202 82,216 96,140" fill="{{it.c3}}"></polygon>
<polygon points="136,128 154,214 134,202 118,216 104,140" fill="{{it.c3}}"></polygon>
<polygon points="{{it.scallop}}" fill="url(#m{{it.id}})"></polygon>
<circle cx="100" cy="96" r="62" fill="#131722"></circle>
<g transform="translate(62 50) scale(3.15)">
<path d="{{it.fill}}" fill="url(#i{{it.id}})"></path>
<path d="{{it.line}}" fill="none" stroke="url(#i{{it.id}})" stroke-width="2.6" stroke-linecap="round"></path>
<path d="{{it.detail}}" fill="none" stroke="#131722" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
</g>
<path d="M22 140h156l-11 13 11 13H22l11-13z" fill="url(#m{{it.id}})"></path>

</svg>
<div style="position: absolute; left: 0; right: 0; top: 70px; height: 13px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 13px; font-weight: 900; line-height: 1; text-shadow: 0 0 4px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.5), 0 1px 1px rgba(0,0,0,0.35); -webkit-text-stroke: 0.7px {{it.c3}}; paint-order: stroke fill; pointer-events: none">{{it.tag}}</div>
</div>
<div style="font-size: 13px; font-weight: 800; text-align: center">{{it.name}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      bronze: { c1: '#F0B88A', c2: '#9A5A34', c3: '#6E3C20', i1: '#FFD7B5', i2: '#D08A58' },
      silver: { c1: '#F6F8FB', c2: '#9AA2B3', c3: '#5F6778', i1: '#FFFFFF', i2: '#AEB6C6' },
      gold:   { c1: '#FFE79A', c2: '#C88E1C', c3: '#8A5E0E', i1: '#FFF0B8', i2: '#E8B033' },
      locked: { c1: '#4A505D', c2: '#2A2F3A', c3: '#22262F', i1: '#6A7080', i2: '#4A505D' }
    };
    const G = {
      scoop: { fill: 'M2.5 9h13.5v3.2a6.75 6.75 0 0 1-13.5 0z', line: 'M15.6 10.4L21.6 7.2', detail: '' },
      drop:  { fill: 'M12 2c-3.4 4.9-6.8 8.4-6.8 12.3a6.8 6.8 0 0 0 13.6 0C18.8 10.4 15.4 6.9 12 2z', line: '', detail: 'M8.8 14.8a3.3 3.3 0 0 0 2.7 3.1' },
      star:  { fill: 'M12 2.2l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.1l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z', line: '', detail: '' },
      bolt:  { fill: 'M13.8 2L4.5 13.6h6.3L9.2 22l10.3-12.3h-6.4z', line: '', detail: '' },
      box:   { fill: 'M12 2.6l8.8 4.5v9.8L12 21.4l-8.8-4.5V7.1z', line: '', detail: 'M3.2 7.1L12 11.6l8.8-4.5 M12 11.6v9.8' }
    };
    const scallop = (() => {
      const pts = [], n = 32;
      for (let k = 0; k < n * 2; k++) {
        const r = k % 2 === 0 ? 86 : 79;
        const a = (Math.PI * k) / n - Math.PI / 2;
        pts.push(`${(100 + r * Math.cos(a)).toFixed(1)},${(96 + r * Math.sin(a)).toFixed(1)}`);
      }
      return pts.join(' ');
    })();
    const raw = [
      { tag: '1.', name: 'İlk Scoop', tier: 'bronze', g: 'star' },
      { tag: '7', name: 'İlk Hafta', tier: 'bronze', g: 'scoop' },
      { tag: '7', name: 'Damla', tier: 'bronze', g: 'drop' },
      { tag: '7', name: 'Yükleme Tamam', tier: 'silver', g: 'bolt' },
      { tag: '30', name: 'Akıntı', tier: 'silver', g: 'drop' },
      { tag: '%100', name: 'Kutu Bitti', tier: 'gold', g: 'box' },
      { tag: '30', name: 'Alışkanlık', tier: 'silver', g: 'scoop', locked: true },
      { tag: '100', name: 'Yüzlük', tier: 'gold', g: 'scoop', locked: true },
      { tag: '100', name: 'Nehir', tier: 'gold', g: 'drop', locked: true }
    ];
    const items = raw.map((it, i) => ({
      ...it, ...T[it.locked ? 'locked' : it.tier], ...G[it.g], id: `${i}`, scallop, opacity: it.locked ? 0.6 : 1
    }));
    return { items };
  }
}
</script>
</body>
</html>
